<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>まち は どちらですか。</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#dff2fb;--panel:#fff;--ink:#292929;--line:#9bcbe0;
  --area:#cfeaf6;--btn:#eef9fd;--sel:#6db9dc;--dark:#286b8a;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
font-family:"Yu Kyokasho","YuKyokasho","BIZ UDPGothic","Noto Sans JP",sans-serif}
.app{width:min(1050px,96vw);margin:auto;padding:10px 0 24px}
.board-title{font-size:13px;color:#777;margin:0 0 3px 3px}
.feed{height:275px;overflow-y:auto;background:rgba(255,255,255,.75);border:1px solid var(--line);
border-radius:14px;padding:5px;display:flex;flex-direction:column;gap:4px}
.empty{height:100%;display:grid;place-items:center;color:#aaa;font-size:14px}
.post{background:#fff;border:1px solid #dbe6d6;border-left:4px solid var(--sel);
border-radius:9px;padding:6px;font-size:16px;flex:0 0 auto}
.composer{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.guide{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;color:#666;font-size:14px;margin-bottom:3px}
.question{text-align:center;font-size:20px;font-weight:600;margin:3px 0 6px}
.preview{display:flex;justify-content:center;align-items:center;gap:5px;min-height:40px;
font-size:19px;font-weight:600;white-space:nowrap;margin-bottom:5px}
.preview-place{
 position:relative;background:var(--area);color:#234f63;border-radius:8px;padding:5px 8px}
.post-btn{border:0;border-radius:9px;background:var(--dark);color:#fff;padding:8px 16px;font-weight:700;cursor:pointer}
.post-btn:disabled{opacity:.28;cursor:default}
.place-box{background:var(--area);border-radius:11px;padding:6px}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.choice{min-height:39px;border:1px solid #76a862;border-radius:7px;background:var(--btn);color:#234f63;
padding:3px 2px;cursor:pointer;font:inherit}
.choice.selected{background:var(--sel);border-color:#286b8a}
.jp{display:block;font-size:14px;font-weight:600;line-height:1}
.cn{display:block;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:10px;line-height:1;
margin-top:3px;opacity:.75}
.patterns{display:flex;justify-content:center;gap:8px;margin-top:5px}
.pattern{min-width:120px;border:1px solid #76a862;border-radius:8px;background:var(--btn);color:#234f63;
padding:7px 10px;font:600 17px inherit;cursor:pointer;transition:.15s}
.pattern.selected{background:var(--sel);border-color:#286b8a}
.pattern.disabled{opacity:.18;cursor:default;filter:grayscale(.5)}
.name-modal{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:99;display:flex;align-items:center;justify-content:center}
.name-box{background:#fff;border-radius:16px;padding:22px;width:min(340px,90vw);text-align:center}
.name-input{width:100%;border:1.5px solid #ccc;border-radius:10px;padding:11px;font-size:16px;text-align:center}
.name-save{margin-top:12px;border:0;border-radius:9px;background:var(--dark);color:#fff;padding:9px 22px;font-weight:700}
.hidden{display:none!important}
@media(max-width:700px){
 .app{padding-top:5px}.feed{height:275px}.composer{margin-top:6px;padding:6px}
 .guide{font-size:13px;margin-bottom:1px}.question{font-size:15px;margin:2px 0 3px}
 .preview{font-size:15px;min-height:32px;gap:3px;margin-bottom:3px}.preview-place{padding:4px 5px}
 .choices{grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
 .choice{min-height:34px;padding:2px 1px}.jp{font-size:13px}.cn{font-size:10px;margin-top:2px}
 .patterns{margin-top:4px;gap:5px}.pattern{min-width:105px;padding:5px 7px;font-size:15px}
 .post-btn{padding:6px 10px;font-size:12px}input{font-size:16px!important}
}

.preview-place,.post-place{position:relative;margin-bottom:10px}
.preview-cn,.post-cn{
  position:absolute;left:0;right:0;top:calc(100% + 2px);
  text-align:center;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:11px;font-weight:500;line-height:1;color:#555;white-space:nowrap
}
.post-line{display:flex;align-items:center;gap:3px;white-space:nowrap;min-height:34px}
.post-place{display:inline-flex;align-items:center;justify-content:center;background:var(--area);
  color:#234f63;border-radius:7px;padding:4px 6px}
@media(max-width:700px){
 .preview-cn,.post-cn{font-size:10px;top:calc(100% + 1px)}
 .preview-place,.post-place{margin-bottom:9px}
}


.second-stage{display:none;margin-top:4px}
.second-stage.show{display:block}
.second-place-box{background:var(--area);border-radius:11px;padding:6px}
.second-choice{min-height:39px;border:1px solid #76a862;border-radius:7px;background:var(--btn);
 color:#234f63;padding:3px 2px;font:inherit}
.second-choice.locked{opacity:.18}
.second-choice.active{background:var(--sel);border-color:#286b8a}
.second-patterns{display:flex;justify-content:center;margin-top:4px}
.second-de{min-width:120px;border:1px solid #76a862;border-radius:8px;background:var(--btn);
 color:#234f63;padding:7px 10px;font:600 17px inherit;cursor:pointer}
.second-de.selected{background:var(--sel);border-color:#286b8a}

/* 投稿の訳は日本語の下に固定。文の位置を上げない */
.post{padding-bottom:13px}
.post-line{min-height:38px;align-items:flex-start;padding-top:4px}
.post-place{margin-bottom:0!important}
.post-cn{top:calc(100% + 2px)!important;transform:none!important;line-height:1!important}

@media(max-width:700px){
 .second-stage{margin-top:3px}
 .second-place-box{padding:3px}
 .second-choice{min-height:34px;padding:2px 1px}
 .second-patterns{margin-top:3px}
 .second-de{min-width:105px;padding:5px 7px;font-size:15px}
 .post{padding-bottom:12px}
 .post-line{min-height:36px;padding-top:3px}
}

.preview{
  padding-bottom:13px !important;

  overflow:visible !important;
}

  margin-bottom:0 !important;

}


/* ===== 下段を上段と同じ文スタイルに統一 ===== */
.second-stage{display:none;margin-top:3px}
.second-stage.show{display:block}

  margin:0 !important;

/* ===== 2段目 名詞群 ===== */
.noun-area{margin-top:5px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.noun-group{background:#fffbd1;border-radius:14px;padding:7px}
.noun-group:last-child{grid-column:1 / -1}
.noun-title{text-align:center;font-size:12px;font-weight:700;margin-bottom:5px;color:#555}
.noun-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.noun-choice{min-height:38px}
.noun-group:last-child .noun-grid{grid-template-columns:repeat(4,minmax(0,1fr))}

 .noun-choice{min-height:34px;font-size:12px}
 .noun-group:last-child .noun-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}


/* ===== 名詞群は分類せず1つに統一 ===== */
.noun-area{
 display:grid !important;

 }

const NAME_KEY="weekend_user_name_v1";
const POSTS_KEY="shusshin_posts_v1";
const METOO_KEY="shusshin_metoo_by_name_v1";
const OFFLINE_QUEUE_KEY="shusshin_offline_queue_v1";
let userName=localStorage.getItem(NAME_KEY)||"";
let posts=[];
try{posts=JSON.parse(localStorage.getItem(POSTS_KEY))||[]}catch{posts=[]}

const adjectives=[
 ["おおきい","大",false],["ちいさい","小",false],
 ["みどりが おおい","绿化多",false],["ひとが おおい","人多",false],
 ["いい","好",false],
 ["しずか","安静",true],["にぎやか","热闹",true],

let selectedThing="";
let selectedNameAdjs=[];
const nameAdjectives=[

 ["たかい","高",false],
 ["ながい","长",false],
 ["あたらしい","新",false],
 ["ふるい","旧",false],
 ["たのしい","玩得开心",false],

];

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function inputValue(){return document.getElementById("shusshinInput").value.trim()}
function alignSecondAnswer(){}

function renderAdj(){
 const area=document.getElementById("adjArea"); area.innerHTML="";
 adjectives.forEach(([jp,cn,needsNa])=>{
  const b=document.createElement("button");
  b.type="button";
  b.className="choice"+(needsNa?" na-adjective":"")+(selectedAdjs.includes(jp)?" selected":"");
  b.innerHTML=`<span class="jp">${esc(jp).replace("が おおい","が<br>おおい")}</span><span class="cn">${esc(cn)}</span>`;
  b.onclick=()=>{
   const i=selectedAdjs.indexOf(jp);
   if(i>=0){
     selectedAdjs.splice(i,1);
   }else{
     if(jp==="ちいさい"){
       selectedAdjs=selectedAdjs.filter(x=>x!=="おおきい");
       if(selectedAdjs.length>=2) selectedAdjs=selectedAdjs.slice(-1);
       selectedAdjs.push("ちいさい");
     }else if(selectedAdjs.includes("ちいさい")){
       if(jp==="おおきい"){
         selectedAdjs=["おおきい"];
       }else{
         selectedAdjs=["ちいさい",jp];

function renderNameAdj(){
 const area=document.getElementById("nameAdjArea");
 if(!area)return;
 area.innerHTML="";
 nameAdjectives.forEach(([jp,cn,needsNa])=>{
  const b=document.createElement("button");
  b.type="button";
  const sizeLocked=(selectedThing==="おおきい たてもの" && (jp==="おおきい" || jp==="ちいさい"));
  b.disabled=sizeLocked;
  b.className="choice"+(needsNa?" na-adjective":"")+(selectedNameAdjs.includes(jp)?" selected":"")+(sizeLocked?" disabled-choice":"");
  b.innerHTML=`<span class="jp">${esc(jp).replace("が おおい","が<br>おおい")}</span><span class="cn">${esc(cn)}</span>`;
  b.onclick=()=>{
   const i=selectedNameAdjs.indexOf(jp);

   if(i>=0){
     selectedNameAdjs.splice(i,1);
   }else{
     // 3段目も対になる語は、後から押した方を優先
     const opposite={
       "おおきい":"ちいさい",
       "ちいさい":"おおきい",
       "にぎやか":"しずか",
       "しずか":"にぎやか"
     }[jp];

     if(opposite){
       const oi=selectedNameAdjs.indexOf(opposite);
       if(oi>=0) selectedNameAdjs.splice(oi,1);
     }

     selectedNameAdjs.push(jp);
     if(selectedNameAdjs.length>2) selectedNameAdjs.shift();
   }

   renderNameAdj();
   updateComposer();
  };
  area.appendChild(b);
 });
}
function thingCardsHtml(thing){
 const card=(jp,cn)=>`<span class="posted-card thing-card"><span>${esc(jp)}</span><span class="posted-cn">${esc(cn)}</span></span>`;
 if(thing==="おおきい たてもの"){
  return card("おおきい","大")+card("たてもの","建筑");
 }
 if(thing==="きれいな たてもの"){
  return card("きれい","漂亮")+'<span class="na-card">な</span>'+card("たてもの","建筑");
 }
 return card(thing,(things.find(x=>x[0]===thing)||[])[1]||"");
}
function renderThings(){
 const area=document.getElementById("thingArea");
 if(!area)return;
 area.innerHTML="";
 things.forEach(([jp,cn])=>{
  const b=document.createElement("button");
  b.type="button";
  b.className="choice"+(selectedThing===jp?" selected":"");
  const shownJp=(jp==="おおきい たてもの"||jp==="きれいな たてもの")
    ? jp.replace(" たてもの","<br>たてもの")
    : jp;
  b.innerHTML=`<span class="jp">${shownJp}</span><span class="cn">${cn}</span>`;
  b.onclick=()=>{
   selectedThing=jp;

   renderThings();

   updateComposer();
  };

 });
}

function orderedTownAdjs(arr){
 const a=(Array.isArray(arr)?arr:[]).filter(Boolean).slice(0,2);
 if(a.length===2 && a.includes("ちいさい")){
   const other=a.find(x=>x!=="ちいさい");
   /* ちいさい＋しずか だけは例外にしない。それ以外は選択順に関係なくちいさいを先頭 */
   if(other && other!=="しずか") return {ordered:["ちいさい",other], useGa:true};
 }
 return {ordered:a, useGa:false};
}
function townAdjHtml(adj, ending){
 const item=adjectives.find(x=>x[0]===adj);
 const needsNa=!!(item&&item[2]);
 const noun=(adj==="おおきい"||adj==="ちいさい")?"まち":"ところ";
 const shownNoun=(adj==="ちいさい" && ending==="ですが、") ? "" : noun;
 return `<span class="adj-answer-line"><span class="posted-card shusshin-adj-card"><span>${esc(adj)}</span><span class="posted-cn">${esc(item?item[1]:"")}</span></span>${needsNa?'<span class="na-card">な</span>':""}<span>${shownNoun}${ending}</span></span>`;
}

function updateComposer(){
 document.querySelector(".q1").textContent=(userName||"名前")+"さん の まち は どちらですか。";
 const v=inputValue(), second=document.getElementById("shusshinSecond");
 const adjTable=document.getElementById("adjTable");
 if(adjTable) adjTable.style.display="block";
 if(!v && (selectedAdjs.length || selectedThing)){
   selectedAdjs=[];
   selectedThing="";
   renderAdj();
   renderThings();
 }
 second.style.display=v?"contents":"none";
 const subjectHtml=v?`<span>${esc(v)}</span>`:"";
 document.getElementById("shusshinSubject").innerHTML=subjectHtml;
 const q2Cell=document.querySelector(".q2");
if(q2Cell) q2Cell.style.display=v?"block":"none";
const a2Cell=document.getElementById("shusshinSubjectAnswer").parentElement;
 a2Cell.style.display=selectedAdjs.length?"flex":"none";
 a2Cell.style.visibility=selectedAdjs.length?"visible":"hidden";
 document.getElementById("shusshinSubjectAnswer").textContent=v;
 const showThird=!!(v&&(selectedAdjs.length || selectedThing));
 const thingTable=document.getElementById("thingTable");
 if(thingTable) thingTable.style.display="block";
 document.getElementById("q3Cell").style.display=showThird?"block":"none";
 document.getElementById("shusshinSubject3").textContent=v;
 document.getElementById("shusshinSubjectAnswer3").textContent=v;
 const thingBox=document.getElementById("thingPreview");
 const a3Cell=document.getElementById("a3Cell");
 if(a3Cell){
   a3Cell.style.display=selectedThing?"flex":"none";
   a3Cell.style.visibility=selectedThing?"visible":"hidden";
 }
 const nameInline=document.getElementById("nameInline");
 if(nameInline){
   nameInline.style.display=selectedThing?"inline-flex":"none";
   const buildingThing=(selectedThing==="おおきい たてもの" || selectedThing==="きれいな たてもの");
   nameInline.classList.toggle("name-next-line",buildingThing);
 }

 const nameInput=document.getElementById("thingNameInput");
 const nameVal=nameInput?nameInput.value.trim():"";
 const nameAdjTable=document.getElementById("nameAdjTable");
 const a5Cell=document.getElementById("a5Cell");
 const q5Cell=document.getElementById("q5Cell");
 if(nameAdjTable){ nameAdjTable.hidden=false; nameAdjTable.style.display="block"; nameAdjTable.classList.add("third-visible"); }
 if(q5Cell) q5Cell.hidden=true;
 if(a5Cell){ a5Cell.hidden=!selectedThing; a5Cell.style.display=selectedThing ? "flex" : "none"; }
 const ns=document.getElementById("thingNameSubject");
 const knownName=!!nameVal && nameVal!=="×";
 if(ns){
   ns.textContent=knownName ? nameVal : "";
   const wa=ns.nextElementSibling;
   if(wa) wa.style.display=knownName ? "" : "none";
 }
 const np=document.getElementById("nameAdjPreview");
 if(np){
   const a=[...selectedNameAdjs];

   // 2語の接続ルール
   // 原則：Aです。そして、Bです。
   // 指定された組み合わせだけ：Aですが、Bです。
   let ordered=a;
   let useGa=false;

   if(a.length===2){
     const has=(x)=>a.includes(x);

     // 「ちいさい」＋「おおきい・しずか」以外：
     // 選択順に関係なく「ちいさい」を先にして「ですが」
     if(has("ちいさい")){
       const other=a.find(x=>x!=="ちいさい");
       if(other && other!=="おおきい" && other!=="しずか"){
         ordered=["ちいさい",other];
         useGa=true;
       }
     }

     // 以下2組は、指定の並びで選んだ時だけ「ですが」
     if(a[0]==="おおきい" && a[1]==="しずか"){
       ordered=a;
       useGa=true;
     }
     if(a[0]==="しずか" && a[1]==="ひとが おおい"){
       ordered=a;
       useGa=true;
     }
   }

   np.innerHTML=ordered.map((adj,i)=>{
     const item=nameAdjectives.find(x=>x[0]===adj);
     const cn=item?item[1]:"";
     let ending="です。";
     if(ordered.length===2 && i===0){
       ending=useGa ? "ですが、" : "です。そして、";
     }
     const body=(adj==="いい") ? "いい ところ" : esc(adj);
     const card=(adj==="いい")
       ? `<span class="posted-card"><span>いい</span><span class="posted-cn">${esc(cn)}</span></span><span>ところ</span>`
       : `<span class="posted-card"><span>${esc(adj)}</span><span class="posted-cn">${esc(cn)}</span></span>`;
     return `<span class="adj-answer-line">${card}<span>${ending}</span></span>`;
   }).join("");
 }
 if(selectedThing){
  thingBox.innerHTML=thingCardsHtml(selectedThing);
  document.getElementById("arimasuText").textContent="が あります。";
 }else{
  thingBox.innerHTML="";
  document.getElementById("arimasuText").textContent="";
 }
 const adjBox=document.getElementById("shusshinAdjPreview");
 if(selectedAdjs.length){
  const rule=orderedTownAdjs(selectedAdjs);
  adjBox.innerHTML=rule.ordered.map((adj,i)=>{
   if(rule.useGa && i===0){
     const item=adjectives.find(x=>x[0]===adj);
     return `<span class="adj-answer-line"><span class="posted-card shusshin-adj-card"><span>${esc(adj)}</span><span class="posted-cn">${esc(item?item[1]:"")}</span></span><span>ですが、</span></span>`;
   }
   return townAdjHtml(adj,"です。");
  }).join("");
 }else{
  adjBox.innerHTML="";
 }
 const buildingWithName =
   (selectedThing==="おおきい たてもの" || selectedThing==="きれいな たてもの") &&
   !!nameVal && nameVal!=="×";
 const hasNameOrUnknown = !!nameVal;
 const canPost =
   !!v && selectedAdjs.length>0 && !!selectedThing && !!userName &&
   hasNameOrUnknown &&
   (selectedNameAdjs.length>0 || buildingWithName);
 document.getElementById("postBtn").disabled=!canPost;



}
document.getElementById("shusshinInput").addEventListener("input",updateComposer);
document.getElementById("thingNameInput").addEventListener("input",()=>{
 updateComposer();
});
document.getElementById("postBtn").onclick=postShusshin;

function meTooMap(){try{return JSON.parse(localStorage.getItem(METOO_KEY))||{}}catch{return {}}}
function meTooKey(id){return userName+"::"+id}
function hasMeToo(id){return !!meTooMap()[meTooKey(id)]}
function rememberMeToo(id){const m=meTooMap();m[meTooKey(id)]=true;localStorage.setItem(METOO_KEY,JSON.stringify(m))}

function postShusshin(){
 const place=inputValue();
 const thingName=(document.getElementById("thingNameInput")?.value||"").trim();
 const buildingWithName =
   (selectedThing==="おおきい たてもの" || selectedThing==="きれいな たてもの") &&
   !!thingName && thingName!=="×";
 const hasNameOrUnknown = !!thingName;
 const canPost = hasNameOrUnknown && (selectedNameAdjs.length>0 || buildingWithName);
 if(!place||!selectedAdjs.length||!selectedThing||!userName||!canPost)return;
 const p={
   id:Date.now(),author:userName,place,
   adjs:[...selectedAdjs],adj:selectedAdjs[0],

   nameAdjs:[...selectedNameAdjs],
   meTooCount:0,createdAt:Date.now()
 };
 posts.push(p); localStorage.setItem(POSTS_KEY,JSON.stringify(posts));
 syncPostToDB(p); renderPosts();
 selectedAdjs=[]; selectedThing=""; selectedNameAdjs=[];
 const thingNameInputReset=document.getElementById("thingNameInput");
 if(thingNameInputReset){thingNameInputReset.value="";thingNameInputReset.classList.remove("unknown-name");}
 document.getElementById("shusshinInput").value="";
 renderAdj();renderThings();renderNameAdj();updateComposer();
}


/* v126: Firebaseでいいね数だけ変化した場合は、投稿DOMを絶対に再生成しない */
function postContentSignature(p){
  return JSON.stringify({
    id:String(p?.id??""),
    author:p?.author??"",
    place:p?.place??"",
    adjs:Array.isArray(p?.adjs)?p.adjs:[],
    adj:p?.adj??"",
    thing:p?.thing??"",
    thingName:p?.thingName??"",
    nameAdjs:Array.isArray(p?.nameAdjs)?p.nameAdjs:[],
    createdAt:p?.createdAt??""
  });
}
function renderOrPatchPosts(nextPosts){
  const next=Array.isArray(nextPosts)?nextPosts:[];
  const oldById=new Map((Array.isArray(posts)?posts:[]).map(p=>[String(p.id),p]));
  const newById=new Map(next.map(p=>[String(p.id),p]));

  let structural=oldById.size!==newById.size;
  if(!structural){
    for(const [id,np] of newById){
      const op=oldById.get(id);
      if(!op || postContentSignature(op)!==postContentSignature(np)){
        structural=true;
        break;
      }
    }
  }

  posts=next;
  if(structural){
    renderPosts();
  }else{
    /* いいね同期は数字と選択状態だけ変更。投稿本体には触れない */
    next.forEach(p=>updateReactionOnly(p.id));
  }
}

function updateReactionOnly(id){
  const p=posts.find(x=>String(x.id)===String(id));
  if(!p)return;
  const escId=(window.CSS&&CSS.escape)?CSS.escape(String(id)):String(id).replace(/"/g,'\\"');
  const d=document.querySelector(`.post[data-post-id="${escId}"]`);
  if(!d)return;

  const count=d.querySelector(":scope > .me-too-count");
  const value=Number(p.meTooCount)||0;
  const nextText=value>0 ? `♥×${value}` : "";
  if(count && count.textContent!==nextText) count.textContent=nextText;

  const btn=d.querySelector(".me-too-btn");
  if(btn){
    const reacted=hasMeToo(id);
    btn.setAttribute("aria-pressed",reacted?"true":"false");
    /* 寸法は変えず、二重クリックだけ防ぐ */
    if(userName!=="あさの") btn.disabled=reacted;
  }
}

async function toggleMeToo(id){
 const p=posts.find(x=>String(x.id)===String(id));
 const unlimited=userName==="あさの";
 if(!p||(!unlimited&&hasMeToo(id)))return;
 if(!unlimited)rememberMeToo(id);
 p.meTooCount=Number(p.meTooCount||0)+1;
 localStorage.setItem(POSTS_KEY,JSON.stringify(posts));
 incrementMeTooDB(id);updateReactionOnly(id);
}

function renderPosts(){
 const guide=document.getElementById("composerGuide");
 if(guide){
   guide.textContent=posts.length
     ? "发布一下自己的家乡吧。（也可以再写一个哦）"
     : "发布一下自己的家乡吧。";
 }

 const feed=document.querySelector(".feed");
 if(!feed)return;
 const restorePosition=preserveFeedPosition(feed);
 feed.innerHTML="";
 posts.forEach(p=>{
  const d=document.createElement("div");d.className="post "+(p.author===userName?"own-post":"other-post");
  d.dataset.postId=p.id;d.dataset.id=p.id;
  const row=document.createElement("div");row.className="posted-row";

  const postAdjs=(Array.isArray(p.adjs)&&p.adjs.length?p.adjs:[p.adj]).filter(Boolean).slice(0,2);
  const answers=postAdjs.map((adj,i)=>{
   const item=adjectives.find(x=>x[0]===adj);
   const cn=item?item[1]:"";
   const needsNa=!!(item&&item[2]);
   const noun=(adj==="おおきい"||adj==="ちいさい")?"まち":"ところ";
   return `<span class="post-answer-line">
     ${i===0?`<span class="posted-place-plain">${esc(p.place)}</span><span>は</span>`:""}
     <span class="posted-card"><span>${esc(adj)}</span><span class="posted-cn">${esc(cn)}</span></span>
     ${needsNa?'<span class="na-card">な</span>':""}<span>${noun}です。</span>
   </span>`;
  }).join("");

  const thingLine=p.thing?`<span class="post-third-line">
    <span class="posted-place-plain">${esc(p.place)}</span><span>に</span>
    ${thingCardsHtml(p.thing)}
    <span>が あります。</span>
    ${p.thingName&&p.thingName!=="×"?`<span class="posted-place-plain">${esc(p.thingName)}</span><span>です。</span>`:""}
  </span>`:"";

  let finalLine="";
  const nas=(Array.isArray(p.nameAdjs)?p.nameAdjs:[]).filter(Boolean).slice(0,2);
  if(p.thingName && nas.length){
    let ordered=[...nas], useGa=false;
    if(nas.length===2){
      if(nas.includes("ちいさい")){
        const other=nas.find(x=>x!=="ちいさい");
        if(other && other!=="おおきい" && other!=="しずか"){
          ordered=["ちいさい",other]; useGa=true;
        }
      }
      if(nas[0]==="おおきい" && nas[1]==="しずか"){ordered=[...nas];useGa=true;}
      if(nas[0]==="しずか" && nas[1]==="ひとが おおい"){ordered=[...nas];useGa=true;}
    }
    const parts=ordered.map((adj,i)=>{
      const item=nameAdjectives.find(x=>x[0]===adj);
      const cn=item?item[1]:"";
      const card=`<span class="posted-card"><span>${esc(adj)}</span><span class="posted-cn">${esc(cn)}</span></span>${adj==="いい"?'<span>ところ</span>':""}`;

      if(ordered.length===1) return `${card}<span>です。</span>`;

      if(i===0){
        return `${card}<span>${useGa?"ですが、":"です。"}</span>`;
      }

      /* 「そして、」は次の形容詞と同じ塊。
         そのため「そして、」直後では折り返さない。
         形容詞の後（です。の前）では折り返し可能。 */
      return `${useGa?"":'<span class="connector-with-adj"><span>そして、</span>'+card+'</span>'}${useGa?card:""}<span>です。</span>`;
    }).join("");
    finalLine=`<span class="post-third-line post-final-line">${p.thingName!=="×"?`<span class="posted-place-plain">${esc(p.thingName)}</span><span>は</span>`:""}${parts}</span>`;
  }

  let firstDescription="";
  if(postAdjs.length){
    const rule=orderedTownAdjs(postAdjs);
    const descriptions=rule.ordered.map((adj,i)=>{
      const item=adjectives.find(x=>x[0]===adj);
      const cn=item?item[1]:"";
      const needsNa=!!(item&&item[2]);

      if(rule.useGa && i===0){
        return `<span class="town-post-sentence">
          <span class="posted-place-plain">${esc(p.place)}</span><span>は</span>
          <span class="posted-card"><span>${esc(adj)}</span><span class="posted-cn">${esc(cn)}</span></span>
          <span>ですが、</span>
        </span>`;
      }

      const noun=(adj==="おおきい"||adj==="ちいさい")?"まち":"ところ";
      return `<span class="town-post-sentence">
        ${i===0?`<span class="posted-place-plain">${esc(p.place)}</span><span>は</span>`:""}
        <span class="posted-card"><span>${esc(adj)}</span><span class="posted-cn">${esc(cn)}</span></span>
        ${needsNa?'<span class="na-card">な</span>':""}<span>${noun}です。</span>
      </span>`;
    }).join("");
    /* 「ちいさいですが、」の時は first-description の前に
       実体のflex改行要素を置く。first-description は display:contents なので、
       親にclassを付ける方式では改行できない。 */
    const postQ2Break=rule.useGa ? '<span class="post-q2-line-break" aria-hidden="true"></span>' : '';
    firstDescription=`${postQ2Break}<span class="first-description${rule.useGa ? " ga-pair" : ""}">${descriptions}</span>`;
  }

  row.innerHTML=`<span class="posted-name">（${esc(p.author)}）</span>
    <span class="post-origin-line">
      <span class="shusshin-wa">私のまちは</span><span class="posted-place-plain">${esc(p.place)}</span><span>です。</span>
      ${firstDescription}
    </span>
    ${thingLine}${finalLine}`;
  d.appendChild(row);

  const wrap=document.createElement("div");wrap.className="me-too-wrap";
  const count=document.createElement("span");count.className="me-too-count";
  count.textContent=Number(p.meTooCount||0)>0?`♥×${Number(p.meTooCount||0)}`:"";
  const btn=document.createElement("button");
  const done=userName!=="あさの"&&hasMeToo(p.id);
  btn.className="me-too-btn"+(done?" liked":"");btn.disabled=done;
  btn.textContent="♥ いいですね！";
  /* v119: いいね操作を投稿カードの長押し削除判定へ伝播させない */
  ["pointerdown","pointerup","pointercancel","click"].forEach(type=>{
    btn.addEventListener(type,e=>e.stopPropagation());
  });
  btn.onclick=(e)=>{
    e.stopPropagation();
    toggleMeToo(p.id);
  };
  wrap.append(btn);
  ["pointerdown","pointerup","pointercancel","click"].forEach(type=>{
    wrap.addEventListener(type,e=>e.stopPropagation());
  });

<script>
/* v125: 投稿生成後/画面幅変更時だけ測定。いいねクリックでは再配置しない */
(()=>{
 const GAP=10, RIGHT=7;

 function textRects(root){
   const out=[];
   const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
   let n;
   while((n=walker.nextNode())){
     if(!n.nodeValue || !n.nodeValue.trim())continue;
     const el=n.parentElement;
     if(!el || el.closest(".posted-cn"))continue;
     const cs=getComputedStyle(el);
     if(cs.display==="none" || cs.visibility==="hidden")continue;
     const r=document.createRange();
     r.selectNodeContents(n);
     [...r.getClientRects()].forEach(x=>{
       if(x.width>0 && x.height>0)out.push(x);
     });
   }
   root.querySelectorAll(".posted-card").forEach(el=>{
     const r=el.getBoundingClientRect();
     if(r.width>0 && r.height>0)out.push(r);
   });
   return out;
 }

 function place(post){
   post.classList.remove("like-fits-last-line");
   post.style.removeProperty("--like-top");

   const row=post.querySelector(".posted-row");
   const wrap=post.querySelector(":scope > .me-too-wrap");
   const btn=wrap?.querySelector(".me-too-btn");
   if(!row || !wrap || !btn)return;

   const rects=textRects(row);
   if(!rects.length)return;

   const maxBottom=Math.max(...rects.map(r=>r.bottom));
   const lastRects=rects.filter(r=>Math.abs(r.bottom-maxBottom)<5);
   if(!lastRects.length)return;

   const lastRight=Math.max(...lastRects.map(r=>r.right));
   const lastTop=Math.min(...lastRects.map(r=>r.top));
   const lastBottom=Math.max(...lastRects.map(r=>r.bottom));

   const pr=post.getBoundingClientRect();
   const pcs=getComputedStyle(post);
   const usableRight=pr.right
     -parseFloat(pcs.borderRightWidth||0)
     -parseFloat(pcs.paddingRight||0)
     -RIGHT;
   const bw=btn.getBoundingClientRect().width;

   if(usableRight-lastRight >= bw+GAP){
     const bh=btn.getBoundingClientRect().height;
     const top=((lastTop+lastBottom)/2)-(bh/2)-pr.top;
     post.style.setProperty("--like-top",Math.max(0,top)+"px");
     post.classList.add("like-fits-last-line");
   }
 }

 function placeAll(){
   requestAnimationFrame(()=>requestAnimationFrame(()=>{
     document.querySelectorAll(".post").forEach(place);
   }));
 }

 const feed=document.getElementById("feed");
 if(feed){
   /* 投稿そのものが追加/削除された時だけ */
   new MutationObserver(ms=>{
     if(ms.some(m=>[...m.addedNodes,...m.removedNodes].some(
       n=>n.nodeType===1 && (n.classList?.contains("post") || n.querySelector?.(".post"))
     ))) placeAll();
   }).observe(feed,{childList:true,subtree:false});
 }
 window.addEventListener("resize",placeAll);
 document.fonts?.ready?.then(placeAll);
 placeAll();
})();
</script>

<script>
/* v168: 出身欄の入力チェック
   優先順：かな → 広西 → 省/州/市 */
(()=>{
 const input=document.getElementById("shusshinInput");
 const pop=document.getElementById("originRetryPopup");
 const text=document.getElementById("originRetryText");
 if(!input||!pop||!text)return;

 let timer=null;
 function show(msg,townRequired=false){
   clearTimeout(timer);
   pop.classList.toggle("town-required",townRequired);
   text.innerHTML=msg;
   pop.classList.remove("show");
   void pop.offsetWidth;
   pop.classList.add("show");
   timer=setTimeout(()=>pop.classList.remove("show"),2200);
 }

 document.addEventListener("click",e=>{
   const button=e.target.closest("#adjArea .choice, #thingArea .choice, #nameAdjArea .choice, #dontKnowNameBtn");
   if(!button || input.value.trim())return;
   e.preventDefault();
   e.stopImmediatePropagation();
   show("请输入城镇名称",true);
   input.focus({preventScroll:true});
 },true);
 input.addEventListener("input",()=>{
   if(input.value.trim() && pop.classList.contains("town-required")){
     clearTimeout(timer);
     pop.classList.remove("show");
   }
 });

 function validate(){
   const v=input.value.trim();
   if(!v)return true;

   if(/[\u3040-\u309F\u30A0-\u30FF]/.test(v)){
     show("请用中文输入地名。<br>请重新输入。");
     input.value="";
     input.dispatchEvent(new Event("input",{bubbles:true}));
     input.focus();
     return false;
   }
   if(v.includes("広西") || v.includes("广西")){
     show("请不要输入“广西”。<br>只输入地名就可以。");
     input.value="";
     input.dispatchEvent(new Event("input",{bubbles:true}));
     input.focus();
     return false;
   }
   if(/[省州市]/.test(v)){
     const hit=v.match(/[省州市]/)?.[0] || "";
     show(`请不要输入“${hit}”。<br>只输入地名就可以。`);
     input.value="";
     input.dispatchEvent(new Event("input",{bubbles:true}));
     input.focus();
     return false;
   }
   return true;
 }

 input.addEventListener("change",validate);
 input.addEventListener("blur",()=>{ if(input.value.trim()) validate(); });

 /* 发布時にも必ず検査 */
 document.addEventListener("click",e=>{
   const btn=e.target.closest("button");
   if(!btn)return;
   if((btn.textContent||"").trim()==="发布" && !validate()){
     e.preventDefault();
     e.stopImmediatePropagation();
   }
 },true);
})();
</script>
